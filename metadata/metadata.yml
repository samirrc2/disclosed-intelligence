metadata_version: 1
name: "Disclosed Intelligence"
description: >
  Reproducibility artifact for "Disclosed Intelligence: A Large-Sample
  Measurement of AI Disclosure in U.S. Investment Adviser Fiduciary Filings."
  Regenerates every numerical result, table, and figure from a frozen,
  pseudonymized dataset with no network or API access: the disclosure-typology
  prevalences with Wilson confidence intervals, the size/type gradient with
  linear-by-linear trend tests and a firm-level logistic regression, the
  survey-weighted estimates with design-based intervals, the independent
  cross-family validation (precision/recall/F1, Cohen's kappa, PABAK), the
  AI-washing exposure screen, and the brochure-vs-marketing venue comparison.
authors:
  - name: "Samir Chincholikar"
